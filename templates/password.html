{% extends 'base.html' %}
{% block body %}
<form class="card narrow" method="post">
  <h2>Change password</h2>
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>Current password <input name="old" type="password" required></label>
  <label>New password <input name="new" type="password" required minlength="4"></label>
  <label>New password again <input name="new2" type="password" required minlength="4"></label>
  <button class="btn">Save</button>
</form>
{% endblock %}
