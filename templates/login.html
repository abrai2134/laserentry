{% extends 'base.html' %}
{% block title %}Login · Laser Entry{% endblock %}
{% block body %}
<form class="card narrow" method="post">
  <h1>Laser Entry</h1>
  <p class="muted">Operator login</p>
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>Username <input name="username" autocapitalize="none" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn big">Login</button>
</form>
{% endblock %}
